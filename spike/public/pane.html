<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDF-Plug spike</title>
<style>
 body{font:13px -apple-system,Segoe UI,sans-serif;margin:8px;color:#1f2328}
 button{margin:2px 4px 2px 0;padding:4px 8px}
 pre{background:#f7f8fa;border:1px solid #e5e7eb;padding:6px;white-space:pre-wrap;word-break:break-all;max-height:55vh;overflow:auto}
 h3{margin:6px 0}
</style>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head><body>
<h3>HDF-Plug spike <small id="ver">v0.0.1</small></h3>
<div>
 <button id="run">Run all tests</button>
 <button id="copy">Copy report</button>
 <button id="clear">Clear</button>
</div>
<div>Open link test (S7): <a id="lnk" href="honeydue-flow://open" target="_blank">honeydue-flow://open</a>
 <button id="open">window.open()</button></div>
<pre id="out">Starting...</pre>
<script>
var out = document.getElementById('out'), lines = [];
function log(s){ lines.push(s); out.textContent = lines.join('\n'); }
function t(){ return new Date().toISOString().slice(11,19); }
function show(label, v){ log('[' + t() + '] ' + label + ': ' + (typeof v === 'string' ? v : JSON.stringify(v))); }

function probe(label, url, opts){
  var start = Date.now();
  return fetch(url, opts).then(function(r){ return r.text().then(function(b){
    show(label, 'OK ' + r.status + ' in ' + (Date.now()-start) + 'ms ' + b.slice(0,90));
  }); }).catch(function(e){ show(label, 'FAIL ' + (e && e.name) + ': ' + (e && e.message)); });
}

function runEnv(){
  show('page origin', location.origin + ' secure=' + window.isSecureContext);
  show('userAgent', navigator.userAgent);
  try {
    var d = Office.context.diagnostics;
    show('S1 host/platform/version', d ? { host: d.hostName, platform: d.platform, version: d.version } : 'no diagnostics');
  } catch(e){ show('diagnostics', 'ERR ' + e.message); }
  var sets = ['1.1','1.3','1.5','1.8','1.9','1.10','1.13'];
  show('S1 Mailbox sets', sets.map(function(v){ return v + '=' + Office.context.requirements.isSetSupported('Mailbox', v); }).join(' '));
  show('S1 ribbon API present', { ribbon: typeof Office.ribbon, requestUpdate: Office.ribbon && typeof Office.ribbon.requestUpdate });
  try {
    var it = Office.context.mailbox.item;
    if (!it) { show('S1 item', 'none (open an email, then Run again)'); return; }
    show('S1 item type', it.itemType + ' subject=' + (it.subject && it.subject.slice ? it.subject.slice(0,40) : typeof it.subject));
    show('S1 from typeof', typeof it.from + (it.from && it.from.getAsync ? ' (getAsync => compose)' : ''));
    if (it.from && it.from.emailAddress) show('S1 from', { name: it.from.displayName, email: it.from.emailAddress });
    show('S1 to typeof', Array.isArray(it.to) ? 'array len ' + it.to.length : typeof it.to);
    if (Array.isArray(it.to)) show('S1 to', it.to.map(function(x){ return x.emailAddress; }));
    show('S1 mailbox user', Office.context.mailbox.userProfile && Office.context.mailbox.userProfile.emailAddress);
  } catch(e){ show('item', 'ERR ' + e.message); }
}

function runStorage(){
  try {
    var k = 'hdf_spike_counter', n = parseInt(localStorage.getItem(k) || '0', 10) + 1;
    var first = localStorage.getItem('hdf_spike_first') || new Date().toISOString();
    localStorage.setItem(k, String(n)); localStorage.setItem('hdf_spike_first', first);
    show('S5 localStorage', 'pane loads so far=' + n + ', first seen ' + first + ' (close/reopen Outlook, then check it kept counting)');
  } catch(e){ show('S5 localStorage', 'FAIL ' + e.message); }
}

function runNetwork(){
  var B = 'http://127.0.0.1:47615/v1/hello';
  return probe('S2a GET http://127.0.0.1', B)
    .then(function(){ return probe('S2b GET http://localhost', 'http://localhost:47615/v1/hello'); })
    .then(function(){ return probe('S2c POST json+Authorization (preflight)', 'http://127.0.0.1:47615/v1/hello', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer spike' }, body: '{"x":1}' }); })
    .then(function(){ return probe('S3  GET https://localhost:47630/ping (Plan B, same origin)', 'https://localhost:47630/ping'); })
    .then(function(){
      // Cross-origin https -> https: this page is on "localhost"; 127.0.0.1 counts as a DIFFERENT origin, like a hosted page would be.
      return probe('S2d GET https://127.0.0.1:47630/ping (cross-origin https)', 'https://127.0.0.1:47630/ping');
    })
    .then(function(){ return probe('S2e POST https://127.0.0.1:47630/ping json+Authorization (cross-origin preflight)', 'https://127.0.0.1:47630/ping', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer spike' }, body: '{"x":1}' }); });
}

function runAll(){
  lines = []; out.textContent = '';
  runEnv(); runStorage();
  runNetwork().then(function(){ log('--- done ---'); });
}

Office.onReady(function(info){
  show('Office.onReady', info);
  document.getElementById('run').onclick = runAll;
  document.getElementById('clear').onclick = function(){ lines = []; out.textContent = ''; };
  document.getElementById('copy').onclick = function(){
    try { navigator.clipboard.writeText(lines.join('\n')).then(function(){ show('copy','ok'); }, function(e){ show('copy','FAIL ' + e.message); }); }
    catch(e){ show('copy','FAIL ' + e.message + ' (select the text by hand)'); }
  };
  document.getElementById('open').onclick = function(){ try { var w = window.open('honeydue-flow://open','_blank'); show('S7 window.open', w ? 'returned a window' : 'returned null'); } catch(e){ show('S7 window.open', 'FAIL ' + e.message); } };
  document.getElementById('lnk').onclick = function(){ show('S7 link', 'clicked'); };
  try {
    Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, function(){ show('S1 ItemChanged', 'fired (pane stays alive while you click other mail)'); runEnv(); });
  } catch(e){ show('ItemChanged', 'FAIL ' + e.message); }
  runAll();
});
</script></body></html>
